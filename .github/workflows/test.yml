name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: go test ./...
      - run: go vet ./...
      - run: npm ci
      - run: npm test
      - run: npm run build:css
      - run: git diff --exit-code assets/app.css
